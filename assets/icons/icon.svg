<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="48%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 110) rotate(45) scale(360)">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="backCardGrad" x1="120" y1="90" x2="360" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="frontCardGrad" x1="150" y1="115" x2="375" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#eef2ff" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="220" y1="168" x2="310" y2="355" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="350" y1="104" x2="396" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cardShadow" x="108" y="96" width="310" height="340" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- App Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#topGlow)"/>
  <rect x="26" y="26" width="460" height="460" rx="110" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Back Tilted Flashcard -->
  <g transform="rotate(-10 256 266)">
    <rect x="132" y="114" width="218" height="284" rx="34" fill="url(#backCardGrad)" stroke="#ffffff" stroke-opacity="0.32" stroke-width="3"/>
  </g>

  <!-- Front Crisp Flashcard -->
  <g filter="url(#cardShadow)">
    <rect x="156" y="118" width="224" height="292" rx="36" fill="url(#frontCardGrad)"/>
    <rect x="157.5" y="119.5" width="221" height="289" rx="34.5" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
  </g>

  <!-- Subtle Card Memory Lines -->
  <rect x="196" y="352" width="84" height="12" rx="6" fill="#c7d2fe"/>
  <rect x="292" y="352" width="48" height="12" rx="6" fill="#e0e7ff"/>

  <!-- FSRS Lightning Bolt -->
  <path d="M279 164L214 256H263L248 330L322 232H272L279 164Z" fill="url(#boltGrad)" stroke="url(#boltGrad)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Mastery Sparkle -->
  <path d="M376 98L383.5 118.5L404 126L383.5 133.5L376 154L368.5 133.5L348 126L368.5 118.5L376 98Z" fill="url(#sparkGrad)"/>
</svg>
