<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="45%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Card 1 (Back tilt) -->
    <linearGradient id="backCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card 2 (Front glass card) -->
    <linearGradient id="frontCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Glowing Orbit Ring -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowApp" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
    <filter id="glowBolt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowOrbit" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern / Top Inner Highlight -->
  <path d="M 0 116 C 0 52 52 0 116 0 L 396 0 C 460 0 512 52 512 116 L 512 160 C 350 140 160 180 0 240 Z" fill="#ffffff" fill-opacity="0.06"/>
  
  <g transform="translate(0, 0)">
    <!-- FSRS Spaced Repetition Orbit Ring -->
    <ellipse cx="256" cy="266" rx="168" ry="168" fill="none" stroke="url(#orbitGrad)" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round" opacity="0.6" filter="url(#glowOrbit)"/>
    
    <!-- Sparkles on orbit -->
    <circle cx="106" cy="200" r="6" fill="#38bdf8"/>
    <circle cx="410" cy="220" r="7" fill="#fef08a"/>
    <circle cx="330" cy="410" r="5" fill="#818cf8"/>

    <!-- Back Flashcard (Angled) -->
    <rect x="130" y="110" width="230" height="290" rx="32" fill="url(#backCardGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" transform="rotate(-12 245 255)"/>

    <!-- Front Flashcard (Glassmorphism) -->
    <rect x="146" y="116" width="220" height="280" rx="32" fill="url(#frontCardGrad)" stroke="rgba(255,255,255,0.45)" stroke-width="3" filter="url(#shadowApp)"/>

    <!-- Card Header Subtle Accent Lines -->
    <rect x="178" y="152" width="72" height="12" rx="6" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="258" y="152" width="40" height="12" rx="6" fill="#38bdf8" fill-opacity="0.6"/>

    <!-- Center Power Lightning Bolt Motif -->
    <path d="M 276 172 L 194 282 L 248 282 L 230 354 L 322 244 L 268 244 Z" fill="url(#boltGrad)" filter="url(#glowBolt)"/>
    
    <!-- High-tech Power Core Accent -->
    <path d="M 264 196 L 214 266 L 254 266 L 242 322 L 298 252 L 260 252 Z" fill="#ffffff" fill-opacity="0.65"/>
  </g>
</svg>
