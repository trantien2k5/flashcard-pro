<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Pro - Bộ Sưu Tập Ảnh Từ Vựng Theo Chủ Đề</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --border: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .title-group h1 {
      font-size: 1.4rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #a5b4fc, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    select, input {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    select:focus, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    input { width: 220px; }
    .badge-count {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
      width: 100%;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.5);
    }
    .img-wrap {
      width: 100%;
      height: 190px;
      background: #090d13;
      overflow: hidden;
      position: relative;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .card:hover .img-wrap img {
      transform: scale(1.05);
    }
    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 6px;
    }
    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .card-word {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
    }
    .card-ipa {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #a5b4fc;
    }
    .card-meaning {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--green);
      line-height: 1.35;
    }
    .card-def {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-topic-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
      align-self: flex-start;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="title-group">
        <h1>📸 Bộ Sưu Tập Ảnh Từ Vựng Flashcard Pro</h1>
        <p>Xem và duyệt nhanh hình ảnh của toàn bộ 2.552 từ vựng theo Chủ đề & Chặng</p>
      </div>
      <div class="controls">
        <select id="topicFilter">
          <option value="ALL">📁 Tất cả chủ đề (2.552 từ)</option>
        </select>
        <input type="text" id="searchInput" placeholder="🔍 Tìm từ hoặc nghĩa...">
        <div class="badge-count" id="countBadge">2552 từ</div>
      </div>
    </div>
  </header>

  <main>
    <div class="grid" id="galleryGrid"></div>
  </main>

  <!-- Nạp dữ liệu standalone cục bộ (Tránh lỗi CORS khi mở trực tiếp file://) -->
  <script src="gallery_data.js"></script>

  <script>
    const data = window.FLASHCARD_GALLERY_DATA || { topics: [], words: [] };
    const TOPICS = data.topics;
    const WORDS = data.words;

    const topicFilter = document.getElementById('topicFilter');
    const searchInput = document.getElementById('searchInput');
    const galleryGrid = document.getElementById('galleryGrid');
    const countBadge = document.getElementById('countBadge');

    // Nạp danh sách chủ đề vào dropdown
    TOPICS.filter(t => !t.parentId).forEach(p => {
      const optGroup = document.createElement('optgroup');
      optGroup.label = p.name;
      
      const parentOpt = document.createElement('option');
      parentOpt.value = `parent:${p.id}`;
      parentOpt.textContent = `★ Toàn bộ ${p.name}`;
      optGroup.appendChild(parentOpt);

      TOPICS.filter(s => s.parentId === p.id).forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = `└─ ${s.name}`;
        optGroup.appendChild(opt);
      });

      topicFilter.appendChild(optGroup);
    });

    function render() {
      const selected = topicFilter.value;
      const search = searchInput.value.trim().toLowerCase();

      let filtered = WORDS;

      if (selected !== 'ALL') {
        if (selected.startsWith('parent:')) {
          const pId = selected.replace('parent:', '');
          const childIds = new Set(TOPICS.filter(s => s.parentId === pId).map(s => s.id));
          childIds.add(pId);
          filtered = filtered.filter(w => w.topicIds && w.topicIds.some(t => childIds.has(t)));
        } else {
          filtered = filtered.filter(w => w.topicIds && w.topicIds.includes(selected));
        }
      }

      if (search) {
        filtered = filtered.filter(w => 
          w.word.toLowerCase().includes(search) || 
          w.meaning.toLowerCase().includes(search) ||
          (w.definition && w.definition.toLowerCase().includes(search))
        );
      }

      countBadge.textContent = `${filtered.length} từ`;

      const html = filtered.slice(0, 500).map(w => {
        const topicObj = TOPICS.find(t => t.id === w.topicIds?.[0]);
        const topicName = topicObj ? topicObj.name : 'Chung';
        return `
          <div class="card" title="${w.word} - ${w.meaning}">
            <div class="img-wrap">
              <img src="../${w.img}" alt="${w.word}" loading="lazy" onerror="this.src='../assets/icons/icon-512.png'">
            </div>
            <div class="card-body">
              <div class="card-head">
                <span class="card-word">${w.word}</span>
                <span class="card-ipa">${w.ipa || ''}</span>
              </div>
              <div class="card-meaning">${w.meaning}</div>
              <div class="card-def">${w.definition || ''}</div>
              <span class="card-topic-tag">${topicName}</span>
            </div>
          </div>
        `;
      }).join('');

      galleryGrid.innerHTML = html || '<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 40px;">Không tìm thấy từ vựng phù hợp</div>';
    }

    topicFilter.addEventListener('change', render);
    searchInput.addEventListener('input', render);

    render();
  </script>
</body>
</html>
