<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flashcard English Pro - Spaced Repetition FSRS-6</title>
  
  <!-- PWA & Mobile Web App Capabilities -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flashcard Pro">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="assets/icons/favicon.ico">
  <!-- Master Consolidated Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=2.9.6">
</head>
<body>

  <!-- ================= APP SHELL ROOT CONTAINER ================= -->
  <div id="app-container">
    <!-- Shell Top Header -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <div class="brand-text">
          <h1>Flashcard Pro</h1>
        </div>
      </div>

      <div class="header-actions">
        <div class="streak-pill" id="header-streak" title="Chuỗi học liên tục">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#f59e0b" stroke="none">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
          </svg>
          <span id="streak-count">0 ngày</span>
        </div>
        <button class="btn-icon" id="btn-header-search" title="Tìm kiếm từ vựng (Ctrl+K hoặc /)" aria-label="Tìm kiếm từ vựng">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
        <button class="btn-icon" id="btn-header-sync" title="Đồng bộ dữ liệu" aria-label="Đồng bộ dữ liệu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
            <path d="M3 21v-5h5"/>
          </svg>
        </button>
        <button class="btn-icon btn-header-profile" id="btn-header-profile" data-tab="tab-profile" title="Hồ sơ cá nhân & Thành tích" aria-label="Hồ sơ cá nhân">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Shell Navigation (Bottom Nav on Mobile & Sidebar on Desktop) -->
    <nav class="app-sidebar bottom-nav" id="app-navigation">
      <div class="sidebar-header">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <div class="sidebar-brand-info">
          <h1 class="sidebar-brand-title">Flashcard Pro</h1>
          <span class="brand-badge">FSRS-6 v2.0</span>
        </div>
      </div>

      <div class="sidebar-nav-list">
        <button class="nav-item active" data-tab="tab-review">
          <span class="nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="6" width="14" height="15" rx="2.5"/>
              <path d="M7 2.5h11.5A2.5 2.5 0 0 1 21 5v12.5"/>
              <path d="M7.5 13.5h5"/>
            </svg>
          </span>
          <span class="nav-label">Ôn tập</span>
        </button>

        <button class="nav-item" data-tab="tab-decks">
          <span class="nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
              <path d="M6 6h10"/>
              <path d="M6 10h10"/>
            </svg>
          </span>
          <span class="nav-label">Chủ đề</span>
        </button>

        <button class="nav-item" data-tab="tab-library">
          <span class="nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m16 6 4 14"/>
              <path d="M12 6v14"/>
              <path d="M8 8v12"/>
              <path d="M4 4v16"/>
            </svg>
          </span>
          <span class="nav-label">Thư viện</span>
        </button>

        <button class="nav-item" data-tab="tab-stats">
          <span class="nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v18h18"/>
              <path d="m19 9-5 5-4-4-3 3"/>
            </svg>
          </span>
          <span class="nav-label">Thống kê</span>
        </button>

        <button class="nav-item" data-tab="tab-settings">
          <span class="nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </span>
          <span class="nav-label">Cài đặt</span>
        </button>
      </div>

      <div class="sidebar-footer">
        <button id="btn-sidebar-sync" class="btn-sync-action" style="padding: 10px 14px; border-radius: 10px; background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.25); color: var(--primary); font-weight: 700; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
          <span>Đồng bộ thiết bị</span>
        </button>
        <div class="sidebar-streak-card">
          <div class="sidebar-streak-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#f59e0b" stroke="none">
              <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
            </svg>
          </div>
          <div class="sidebar-streak-info">
            <span class="sidebar-streak-title">Chuỗi học liên tục</span>
            <span class="sidebar-streak-val"><strong id="desktop-streak-count">0</strong> ngày</span>
          </div>
        </div>
      </div>
    </nav>

    <!-- Dynamic View Mount Points -->
    <main class="tab-content-area" id="main-content">
      <section id="tab-review" class="tab-pane active"></section>
      <section id="tab-decks" class="tab-pane"></section>
      <section id="tab-subtopics" class="tab-pane"></section>
      <section id="tab-subtopic-words" class="tab-pane"></section>
      <section id="tab-library" class="tab-pane"></section>
      <section id="tab-stats" class="tab-pane"></section>
      <section id="tab-settings" class="tab-pane"></section>
      <section id="tab-profile" class="tab-pane"></section>
    </main>
  </div>

  <!-- Dynamic Overlay & Modal Mount Targets -->
  <div id="study-overlay" class="study-overlay"></div>
  <div id="modals-root"></div>
  <div id="toast-container" class="toast-container"></div>

  <!-- App Core Script -->
  <script type="module" src="js/app.js?v=2.9.6"></script>
</body>
</html>
